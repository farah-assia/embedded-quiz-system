<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — κουίζυ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-primary: #163b50;
            --navy-dark: #0f2736;
            --gold-accent: #f5c242;
            --gold-hover: #e0ac2b;
            --surface-white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: var(--navy-primary);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }
        .card {
            background: #ffffff;
            color: var(--text-dark);
            max-width: 420px;
            width: 100%;
            border-radius: 28px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-wrap {
            margin-bottom: 1.25rem;
        }
        .offline-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #fee2e2;
            color: #dc2626;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            margin-bottom: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.85rem;
            color: var(--navy-primary);
            margin-bottom: 0.5rem;
            font-weight: 900;
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }
        .wifi-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            padding: 1rem 1.25rem;
            width: 100%;
            margin-bottom: 1.75rem;
            text-align: left;
        }
        .wifi-box strong {
            display: block;
            color: var(--navy-primary);
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }
        .wifi-box span {
            color: var(--text-muted);
            font-size: 0.82rem;
        }
        .btn-retry {
            background: var(--gold-accent);
            color: var(--navy-primary);
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 9999px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(245, 194, 66, 0.4);
        }
        .btn-retry:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <svg style="width: 64px; height: 64px;" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 15L90 35L50 55L10 35L50 15Z" fill="#f5c242"/>
                <path d="M50 55V78C50 78 75 72 75 52V42.5L50 55Z" fill="#e0ac2b"/>
                <path d="M50 55V78C50 78 25 72 25 52V42.5L50 55Z" fill="#f5c242"/>
                <circle cx="20" cy="38" r="4" fill="#f5c242"/>
                <path d="M20 42V65" stroke="#f5c242" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="offline-badge">
            <span>●</span> No Access Point Signal
        </div>
        <h1>Connection Lost</h1>
        <p>You seem to be disconnected from the classroom network. Connect back to the Raspberry Pi hotspot to continue your quiz.</p>

        <div class="wifi-box">
            <strong>📶 Wi-Fi Hotspot:</strong>
            <span>Check your phone Wi-Fi settings and reconnect to <b>ClassQuiz-Offline</b> or the classroom router.</span>
        </div>

        <button class="btn-retry" onclick="window.location.href='/student'">Try Reconnecting ↻</button>
    </div>
</body>
</html>
